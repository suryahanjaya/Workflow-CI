name: CI Retraining — MLflow Project + Docker Build & Push

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'MLProject/**'
      - '.github/workflows/retraining.yml'
  workflow_dispatch:
    inputs:
      n_estimators:
        description: 'Number of trees in Random Forest'
        required: false
        default: '100'
      max_depth:
        description: 'Max depth of trees (None for unlimited)'
        required: false
        default: 'None'
      docker_tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

env:
  DAGSHUB_USERNAME: suryahanjaya
  DAGSHUB_REPO:     adult-income-classifier
  DOCKERHUB_IMAGE:  suryahanjaya/adult-income-classifier

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Retrain model with MLflow Project
  # ──────────────────────────────────────────────────────────
  retrain:
    name: Retrain Model (MLflow Project)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.12'
          auto-update-conda: true
          auto-activate-base: true

      - name: Install MLflow
        run: |
          conda run pip install "mlflow==2.19.0" dagshub

      - name: Set DagsHub MLflow Tracking Credentials
        run: |
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/${{ env.DAGSHUB_USERNAME }}/${{ env.DAGSHUB_REPO }}.mlflow" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=${{ env.DAGSHUB_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Run MLflow Project
        env:
          MLFLOW_TRACKING_USERNAME: ${{ env.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
        run: |
          cd MLProject
          conda run mlflow run . \
            --experiment-name "adult-income-ci" \
            --env-manager conda \
            -P n_estimators=${{ github.event.inputs.n_estimators || '100' }} \
            -P max_depth=${{ github.event.inputs.max_depth || 'None' }} \
            -P data_path="adult_income_preprocessed.csv"

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-run-${{ github.run_number }}
          path: MLProject/mlruns/
          retention-days: 14

  # ──────────────────────────────────────────────────────────
  # JOB 2: Build & Push Docker image
  # ──────────────────────────────────────────────────────────
  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: retrain

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.12'
          auto-update-conda: true
          auto-activate-base: true

      - name: Install MLflow + dependencies
        run: |
          conda run pip install "mlflow==2.19.0" dagshub scikit-learn pandas numpy

      - name: Set DagsHub MLflow Tracking Credentials
        run: |
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/${{ env.DAGSHUB_USERNAME }}/${{ env.DAGSHUB_REPO }}.mlflow" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=${{ env.DAGSHUB_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get Latest MLflow Run Model URI
        env:
          MLFLOW_TRACKING_USERNAME: ${{ env.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
        run: |
          MODEL_URI=$(conda run python -c "
          import mlflow
          client = mlflow.MlflowClient()
          exp = client.get_experiment_by_name('adult-income-ci')
          runs = client.search_runs([exp.experiment_id], order_by=['start_time DESC'], max_results=1)
          run_id = runs[0].info.run_id
          print(f'runs:/{run_id}/random_forest_model')
          ")
          echo "MODEL_URI=${MODEL_URI}" >> $GITHUB_ENV
          echo "[INFO] Model URI: ${MODEL_URI}"

      - name: Build Docker Image using MLflow
        env:
          MLFLOW_TRACKING_USERNAME: ${{ env.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
        run: |
          DOCKER_TAG="${{ github.event.inputs.docker_tag || 'latest' }}"
          IMAGE_NAME="${{ env.DOCKERHUB_IMAGE }}:${DOCKER_TAG}"
          IMAGE_SHA="${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}"

          echo "[INFO] Building Docker image: ${IMAGE_NAME}"
          conda run mlflow models build-docker \
            --model-uri "${{ env.MODEL_URI }}" \
            --name "${IMAGE_NAME}" \
            --env-manager local

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "IMAGE_SHA=${IMAGE_SHA}" >> $GITHUB_ENV

      - name: Tag Docker Image with SHA
        run: |
          docker tag "${{ env.IMAGE_NAME }}" "${{ env.IMAGE_SHA }}"

      - name: Push Docker Image to Docker Hub
        run: |
          docker push "${{ env.IMAGE_NAME }}"
          docker push "${{ env.IMAGE_SHA }}"

      - name: Print Summary
        run: |
          echo "======================================================"
          echo "  CI Retraining + Docker — COMPLETED SUCCESSFULLY"
          echo "======================================================"
          echo "Repo         : https://github.com/suryahanjaya/adult-income-classifier"
          echo "Run number   : ${{ github.run_number }}"
          echo "Docker Image : ${{ env.IMAGE_NAME }}"
          echo "Docker SHA   : ${{ env.IMAGE_SHA }}"
          echo "======================================================"
